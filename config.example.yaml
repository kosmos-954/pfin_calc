telegram:
  bot_token: "your_bot_token_here"
  chat_id: "your_chat_id_here"

stellar:
  horizon_url: "https://horizon.stellar.org"
  target_account: "YOUR_STELLAR_WALLET_ADDRESS"
  base_asset: "PFIN"
  payment_asset: "USDM"
  asset_issuer: "YOUR_ASSET_ISSUER_ADDRESS"

# Дата начала обязательства (не дата первой выплаты!)
schedule_start: "2025-10-01"
# Через сколько месяцев после schedule_start — первая выплата/выкуп
payment_delay_months: 1
# Базовая ставка в год старта: 0.1% (+0.1% каждый следующий год)
base_rate_pct: 0.1
# Окно мониторинга в минутах (= периодичность крона)
monitor_window_minutes: 15


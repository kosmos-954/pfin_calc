name: Deploy to GCP Cloud Functions

on:
  push:
    branches:
      - main # Пайплайн запускается при коммите в ветку main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Cloud Function (Gen2)
        run: |
          gcloud functions deploy stellar-bot \
            --gen2 \
            --runtime=python311 \
            --region=us-central1 \
            --source=. \
            --entry-point=handle_request \
            --trigger-http \
            --no-allow-unauthenticated \
            --memory=512MB \
            --timeout=540s \
            --set-env-vars="TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }},TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}"

      - name: Verify deployment
        run: |
          gcloud functions describe stellar-bot \
            --v2 \
            --region=us-central1 \
            --format="table(name, state, serviceConfig.uri)"

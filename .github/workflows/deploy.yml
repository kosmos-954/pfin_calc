name: Deploy to GCP Cloud Functions

on:
  push:
    branches:
      - main # Пайплайн запускается при коммите в ветку main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Deploy Cloud Function
        id: deploy
        uses: google-github-actions/deploy-cloud-functions@v2
        with:
          name: stellar-bot
          runtime: python311
          region: us-central1
          entry_point: handle_request
          source_dir: .
          generation: 2
          timeout: 540s
          memory: 512Mi
          env_vars: |-
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Verify deployment
        run: |
          echo "Function URL: ${{ steps.deploy.outputs.url }}"
          gcloud functions describe stellar-bot \
            --v2 \
            --region=us-central1 \
            --format="table(name, state, serviceConfig.uri)"

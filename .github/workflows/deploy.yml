name: Deploy to GCP Cloud Functions

on:
  push:
    branches:
      - main # Пайплайн запускается при коммите в ветку main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Deploy Cloud Function
        uses: google-github-actions/deploy-cloud-functions@v2
        with:
          name: stellar-bot
          runtime: python311
          region: us-central1
          entry_point: handle_request
          source_dir: .
          generation: 2
          # service_account — runtime SA (от чьего имени выполняется функция)
          # Если не указан, используется дефолтный Compute SA проекта.
          # Для явного указания создайте отдельный SA и раскомментируйте:
          # service_account: stellar-bot-runtime@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com
          timeout: 540s        # макс. 540 с для Gen2; аудит сканирует блокчейн
          memory: 512Mi        # Stellar SDK + paging требует памяти
          env_vars: |-
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}